name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, zlib
          coverage: none

      - name: Install the dependencies
        uses: ramsey/composer-install@v4

      - name: Check that the tag matches Expo::VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          constant=$(php -r 'require "src/Expo.php"; echo Expo\Push\Expo::VERSION;')
          if [ "$tag" != "$constant" ]; then
            echo "The tag is $tag. Expo::VERSION is $constant."
            echo "Set the constant to $tag, then move the tag."
            exit 1
          fi
          echo "The tag and the constant are both $tag."

      - name: Run the tests
        run: vendor/bin/phpunit

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
