name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, zlib
          coverage: none

      - name: Install the dependencies
        uses: ramsey/composer-install@v4

      - name: Check that the tag matches Expo::VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          constant=$(php -r 'require "src/Expo.php"; echo Expo\Push\Expo::VERSION;')
          if [ "$tag" != "$constant" ]; then
            echo "The tag is $tag. Expo::VERSION is $constant."
            echo "Set the constant to $tag, then move the tag."
            exit 1
          fi
          echo "The tag and the constant are both $tag."

      - name: Run the tests
        run: vendor/bin/phpunit

      - name: Read the release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ -s release-notes.md ]; then
            echo "The notes come from CHANGELOG.md."
          else
            echo "CHANGELOG.md holds no section for $version. GitHub builds the notes."
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
