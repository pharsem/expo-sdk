# Groups the notes that GitHub generates for a release.
# The groups come from the labels on a merged pull request.
changelog:
  exclude:
    labels:
      - skip-changelog
    authors:
      - dependabot
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Build and CI
      labels:
        - ci
        - dependencies
    - title: Other changes
      labels:
        - "*"
